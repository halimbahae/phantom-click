[package]
name = "phantom-click-mcp"
version = "0.4.0"
edition = "2021"
description = "MCP server for Phantom Click - control mouse cursor and clicks from AI assistants"
license = "MIT"
repository = "https://github.com/halimbahae/phantom-click"

[dependencies]
phantom-click = { path = "../phantom-click", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }
